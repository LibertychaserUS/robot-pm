[project]
name = "robot-pm"
version = "0.1.0"
description = "Generic Feishu Bitable editor for robot PM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.5",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
