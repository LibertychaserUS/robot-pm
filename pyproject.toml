[project]
name = "robot-pm"
version = "0.1.0"
description = "Feishu project assistant and Bitable editor"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx==0.28.1",
    "markdown-it-py==4.2.0",
    "python-docx==1.2.0",
    "pypdf==6.19.0",
]

[project.optional-dependencies]
dev = [
    "cython==3.0.12",
    "pytest==8.3.5",
]

[project.scripts]
robot-pm-deploy = "robot_pm.deploy:main"

[build-system]
requires = ["setuptools>=69", "cython==3.0.12"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
