name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install GCC 14
        run: sudo apt-get update && sudo apt-get install -y g++-14

      - name: Configure Debug with ASan and UBSan
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_COMPILER=g++-14

      - name: Build
        run: cmake --build build -j"$(nproc)"

      - name: CTest regression
        run: ctest --test-dir build -L regression --output-on-failure

      - name: Fail on black-box skipped cases
        run: |
          set -euo pipefail
          log=$(mktemp)
          set +e
          ./build/tests/blackbox/robot_pm_blackbox >"$log" 2>&1
          status=$?
          set -e
          cat "$log"
          summary=$(grep -E 'test cases:.*passed.*failed.*skipped' "$log" | tail -n 1 || true)
          if [ -z "${summary}" ]; then
            echo "black-box binary did not print a pass/fail/skip summary"
            exit 1
          fi
          echo "pass/fail/skip summary: ${summary}"
          skipped=$(printf '%s\n' "${summary}" | sed -E 's/.*[^0-9]([0-9]+) skipped.*/\1/')
          if [ "${skipped}" != "0" ]; then
            echo "black-box skipped count is ${skipped}"
            exit 1
          fi
          exit "${status}"

      - name: Pytest
        run: |
          python3 -m venv .venv
          .venv/bin/pip install -e ".[dev]"
          .venv/bin/pytest

      - name: Prepare data directory when credentials exist
        run: |
          set -euo pipefail
          required=(
            FEISHU_APP_ID
            FEISHU_APP_SECRET
            FEISHU_ENCRYPT_KEY
            FEISHU_VERIFICATION_TOKEN
            FEISHU_BITABLE_APP_TOKEN
            FEISHU_BITABLE_TABLE_ID
          )
          for name in "${required[@]}"; do
            if [ -z "${!name:-}" ]; then
              echo "skip host prepare: ${name} is not set"
              exit 0
            fi
          done
          .venv/bin/robot-pm-deploy --data-root "${RUNNER_TEMP:-/tmp}/robot_pm"
